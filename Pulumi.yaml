name: pose-sample-app
description: PyTorch training cluster on GKE with GPU support
runtime:
  name: nodejs
  options:
    typescript: false
    packagemanager: npm
config:
  pulumi:tags:
    value:
      pulumi:template: pytorch-gke-cluster
  gcp:project:
    description: GCP project ID
  gcp:region:
    description: GCP region for resources
    default: us-central1
  cluster:name:
    description: Name of the GKE cluster
    default: pytorch-training-cluster
